<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도토리 - 독서기록</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
    }
    .icon {
      width: 100px;
      height: 100px;
      border-radius: 22px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: #555;
      line-height: 1.6;
      max-width: 320px;
      margin-bottom: 32px;
    }
    a {
      display: inline-block;
      background: #000;
      color: #fff;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>🌰 도토리</h1>
  <p>독서 기록을 쌓고, 내 서재를 만들어보세요.<br>읽은 책, 읽고 싶은 책을 한 곳에서 관리하세요.</p>
  <a href="https://apps.apple.com/app/id6780739854">App Store에서 다운로드</a>
</body>
</html>
